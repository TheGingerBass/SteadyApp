<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Steady</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steady">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12161D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #12161D;
    --surface: #1C222C;
    --surface-2: #262E3A;
    --line: #313A47;
    --text: #E9E6DF;
    --text-dim: #97A0AC;
    --sage: #7FA79B;
    --sage-dim: #4F6E65;
    --gold: #D8B26E;
    --clay: #C97B63;
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }

  header {
    padding: 18px 22px 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  header .date {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  header .mark {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--sage);
    font-style: italic;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 22px 90px;
  }

  .tab { display: none; animation: fade .25s ease; }
  .tab.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- TODAY ---------- */
  .streak-card {
    text-align: center;
    padding: 36px 0 28px;
  }
  .streak-number {
    font-family: 'Fraunces', serif;
    font-size: 96px;
    line-height: 1;
    font-weight: 500;
    color: var(--text);
  }
  .streak-label {
    font-size: 15px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .btn {
    padding: 16px 18px;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 500;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .btn-primary { background: var(--sage-dim); color: #EFF6F3; }
  .btn-primary:disabled { background: var(--surface); color: var(--text-dim); }
  .btn-quiet { background: var(--surface); color: var(--text); }
  .btn-quiet.danger { color: var(--clay); }

  .stat-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .stat {
    flex: 1;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat .n { font-family: 'Fraunces', serif; font-size: 26px; }
  .stat .l { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

  .today-pledge {
    margin-top: 22px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .today-pledge .l { font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
  .today-pledge .p { font-size: 15px; line-height: 1.45; font-style: italic; font-family: 'Fraunces', serif; }
  .today-pledge .empty { color: var(--text-dim); font-style: normal; font-family: inherit; }

  /* ---------- PANIC ---------- */
  .panic-intro {
    text-align: center;
    padding-top: 28px;
  }
  .panic-intro h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    margin: 0 0 6px;
  }
  .panic-intro p {
    color: var(--text-dim);
    font-size: 14.5px;
    margin: 0;
  }

  .breath-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 0 20px;
  }
  .breath-ring {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--sage) 0%, var(--sage-dim) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.55);
    box-shadow: 0 0 0 1px rgba(127,167,155,0.25);
  }
  .breath-ring.running {
    animation: breathe 14s ease-in-out infinite;
  }
  @keyframes breathe {
    0%   { transform: scale(0.55); }
    28.5% { transform: scale(1); }       /* inhale ~4s */
    57%  { transform: scale(1); }        /* hold ~4s  */
    100% { transform: scale(0.55); }     /* exhale ~6s */
  }
  .breath-word {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: #0E1410;
  }
  .breath-caption {
    margin-top: 22px;
    font-size: 14.5px;
    color: var(--text-dim);
    min-height: 20px;
  }

  .affirmation {
    margin: 22px 0 6px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 20px;
    text-align: center;
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-style: italic;
    line-height: 1.4;
  }

  .panic-actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- JOURNAL ---------- */
  .section-label {
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 22px 0 8px;
  }
  .section-label:first-child { margin-top: 4px; }

  textarea, input[type=text] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 14px 16px;
    resize: none;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--sage-dim); }

  .save-row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .save-row .btn { padding: 10px 16px; font-size: 14px; }

  .entry {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .entry .meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .entry .meta button { color: var(--text-dim); text-decoration: underline; font-size: 12px; }
  .entry .body { font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }

  .empty-state {
    color: var(--text-dim);
    font-size: 14.5px;
    padding: 10px 2px 4px;
  }

  .backup-row {
    display: flex;
    gap: 10px;
    margin-top: 28px;
  }
  .backup-row .btn { flex: 1; text-align: center; justify-content: center; font-size: 13.5px; padding: 12px; }

  /* ---------- TAB BAR ---------- */
  #tabbar {
    position: sticky;
    bottom: 0;
    display: flex;
    background: rgba(28,34,44,0.92);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    font-size: 13.5px;
    color: var(--text-dim);
    padding: 8px 0 4px;
    position: relative;
  }
  .tab-btn.active { color: var(--text); }
  .tab-btn .dot {
    display: block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--sage);
    margin: 6px auto 0;
    opacity: 0;
  }
  .tab-btn.active .dot { opacity: 1; }
</style>
</head>
<body>

<div id="app">
  <header>
    <span class="date" id="today-date"></span>
    <span class="mark">steady</span>
  </header>

  <main>
    <!-- TODAY -->
    <section class="tab active" id="tab-today">
      <div class="streak-card">
        <div class="streak-number" id="streak-num">0</div>
        <div class="streak-label" id="streak-label">days steady</div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btn-log-clean">
          <span id="btn-log-text">Log today as clean</span>
          <span>&#10003;</span>
        </button>
        <button class="btn btn-quiet danger" id="btn-log-slip">I slipped today</button>
      </div>

      <div class="stat-row">
        <div class="stat"><div class="n" id="stat-best">0</div><div class="l">best streak</div></div>
        <div class="stat"><div class="n" id="stat-total">0</div><div class="l">total clean days</div></div>
      </div>

      <div class="today-pledge">
        <div class="l">Today's pledge</div>
        <div class="p" id="today-pledge-text"><span class="empty">Not set yet — add one from the Journal tab.</span></div>
      </div>
    </section>

    <!-- PANIC -->
    <section class="tab" id="tab-panic">
      <div class="panic-intro">
        <h1>Right now, breathe.</h1>
        <p>This urge is real, and it will pass.</p>
      </div>

      <div class="breath-wrap">
        <div class="breath-ring" id="breath-ring">
          <span class="breath-word" id="breath-word">start</span>
        </div>
        <div class="breath-caption" id="breath-caption">Tap the circle when you're ready.</div>
      </div>

      <div class="affirmation" id="affirmation-text">You've gotten through this before.</div>

      <div class="panic-actions">
        <button class="btn btn-quiet" id="btn-new-affirmation">Show another line</button>
        <button class="btn btn-primary" id="btn-steadier">I'm steadier now</button>
      </div>
    </section>

    <!-- JOURNAL -->
    <section class="tab" id="tab-journal">
      <div class="section-label">Today's pledge</div>
      <textarea id="pledge-input" rows="3" placeholder="What are you committing to today?"></textarea>
      <div class="save-row"><button class="btn btn-quiet" id="btn-save-pledge">Save pledge</button></div>

      <div class="section-label">New entry</div>
      <textarea id="entry-input" rows="4" placeholder="What's going on right now?"></textarea>
      <div class="save-row"><button class="btn btn-quiet" id="btn-save-entry">Add entry</button></div>

      <div class="section-label">Past entries</div>
      <div id="entries-list"></div>

      <div class="backup-row">
        <button class="btn btn-quiet" id="btn-export">Export backup</button>
        <button class="btn btn-quiet" id="btn-import">Import backup</button>
      </div>
    </section>
  </main>

  <nav id="tabbar">
    <button class="tab-btn active" data-tab="today">Today<span class="dot"></span></button>
    <button class="tab-btn" data-tab="panic">Panic<span class="dot"></span></button>
    <button class="tab-btn" data-tab="journal">Journal<span class="dot"></span></button>
  </nav>
</div>

<script>
(function () {
  const STORAGE_KEY = 'steady_data_v1';

  const AFFIRMATIONS = [
    "You've gotten through this before.",
    "The urge is loud, but it isn't in charge.",
    "You don't have to win the whole night — just this next minute.",
    "Wanting it and needing it are different things.",
    "This feeling has a shape, and it's temporary.",
    "You can be uncomfortable and still be okay.",
    "One clean choice doesn't erase a slip — it just starts the next streak.",
    "Nobody is watching. You're doing this for you."
  ];

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function defaultData() {
    return {
      streak: 0,
      bestStreak: 0,
      totalClean: 0,
      lastLoggedDate: null,
      pledges: {},   // date -> text
      entries: []    // { id, date, ts, text }
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      const parsed = JSON.parse(raw);
      return Object.assign(defaultData(), parsed);
    } catch (e) {
      return defaultData();
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = load();

  // ---------- rendering ----------
  function renderToday() {
    document.getElementById('streak-num').textContent = state.streak;
    document.getElementById('streak-label').textContent = state.streak === 1 ? 'day steady' : 'days steady';
    document.getElementById('stat-best').textContent = state.bestStreak;
    document.getElementById('stat-total').textContent = state.totalClean;

    const loggedToday = state.lastLoggedDate === todayStr();
    const logBtn = document.getElementById('btn-log-clean');
    const logText = document.getElementById('btn-log-text');
    logBtn.disabled = loggedToday;
    logText.textContent = loggedToday ? 'Logged for today' : 'Log today as clean';

    const pledge = state.pledges[todayStr()];
    const pledgeEl = document.getElementById('today-pledge-text');
    pledgeEl.innerHTML = pledge
      ? escapeHtml(pledge)
      : '<span class="empty">Not set yet — add one from the Journal tab.</span>';
  }

  function renderJournal() {
    document.getElementById('pledge-input').value = state.pledges[todayStr()] || '';
    const list = document.getElementById('entries-list');
    if (state.entries.length === 0) {
      list.innerHTML = '<div class="empty-state">Nothing logged yet. This is a quiet place to write down what today actually felt like.</div>';
      return;
    }
    const sorted = [...state.entries].sort((a, b) => b.ts - a.ts);
    list.innerHTML = sorted.map(e => `
      <div class="entry" data-id="${e.id}">
        <div class="meta">
          <span>${formatDate(e.ts)}</span>
          <button data-del="${e.id}">delete</button>
        </div>
        <div class="body">${escapeHtml(e.text)}</div>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
           d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  // ---------- tab switching ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + tab));
      if (tab === 'journal') renderJournal();
    });
  });

  // ---------- today actions ----------
  document.getElementById('btn-log-clean').addEventListener('click', () => {
    const t = todayStr();
    if (state.lastLoggedDate === t) return;
    state.streak += 1;
    state.totalClean += 1;
    state.lastLoggedDate = t;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    save();
    renderToday();
  });

  document.getElementById('btn-log-slip').addEventListener('click', () => {
    if (!confirm("Log a slip? Your current streak will reset, but nothing else is lost.")) return;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    state.streak = 0;
    state.lastLoggedDate = null;
    save();
    renderToday();
  });

  // ---------- panic / breathing ----------
  const ring = document.getElementById('breath-ring');
  const word = document.getElementById('breath-word');
  const caption = document.getElementById('breath-caption');
  let breathing = false;
  let breathTimer = null;

  function startBreathing() {
    breathing = true;
    ring.classList.add('running');
    word.textContent = 'in';
    caption.textContent = 'Breathe in through your nose.';
    const cycle = () => {
      word.textContent = 'in';
      caption.textContent = 'Breathe in through your nose.';
      breathTimer = setTimeout(() => {
        word.textContent = 'hold';
        caption.textContent = 'Hold it gently.';
        breathTimer = setTimeout(() => {
          word.textContent = 'out';
          caption.textContent = 'Let it go, slowly.';
          breathTimer = setTimeout(cycle, 6000);
        }, 4000);
      }, 4000);
    };
    cycle();
  }

  function stopBreathing() {
    breathing = false;
    ring.classList.remove('running');
    clearTimeout(breathTimer);
    word.textContent = 'start';
    caption.textContent = "Tap the circle when you're ready.";
  }

  ring.addEventListener('click', () => {
    if (breathing) stopBreathing(); else startBreathing();
  });

  document.getElementById('btn-new-affirmation').addEventListener('click', () => {
    const el = document.getElementById('affirmation-text');
    let next;
    do { next = AFFIRMATIONS[Math.floor(Math.random() * AFFIRMATIONS.length)]; }
    while (next === el.textContent && AFFIRMATIONS.length > 1);
    el.textContent = next;
  });

  document.getElementById('btn-steadier').addEventListener('click', () => {
    stopBreathing();
    document.querySelector('.tab-btn[data-tab="today"]').click();
  });

  // ---------- journal ----------
  document.getElementById('btn-save-pledge').addEventListener('click', () => {
    const val = document.getElementById('pledge-input').value.trim();
    if (val) state.pledges[todayStr()] = val;
    else delete state.pledges[todayStr()];
    save();
    renderToday();
  });

  document.getElementById('btn-save-entry').addEventListener('click', () => {
    const input = document.getElementById('entry-input');
    const val = input.value.trim();
    if (!val) return;
    state.entries.push({ id: Date.now().toString(36), date: todayStr(), ts: Date.now(), text: val });
    input.value = '';
    save();
    renderJournal();
  });

  document.getElementById('entries-list').addEventListener('click', (e) => {
    const id = e.target.getAttribute('data-del');
    if (!id) return;
    if (!confirm('Delete this entry?')) return;
    state.entries = state.entries.filter(en => en.id !== id);
    save();
    renderJournal();
  });

  // ---------- backup ----------
  document.getElementById('btn-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'steady-backup-' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btn-import').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          state = Object.assign(defaultData(), parsed);
          save();
          renderToday();
          renderJournal();
          alert('Backup restored.');
        } catch (e) {
          alert('That file could not be read.');
        }
      };
      reader.readAsText(file);
    });
    input.click();
  });

  // ---------- init ----------
  document.getElementById('today-date').textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'long', month: 'long', day: 'numeric'
  });
  renderToday();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
